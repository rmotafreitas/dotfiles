name: Check dotfiles
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check shell syntax
        run: |
          bash -n home/.bashrc home/.profile home/.config/shell/toolchain.sh home/.config/shell/aliases.sh macos/home/.bash_profile macos/home/.config/shell/macos.sh macos/defaults.sh
          zsh -n home/.zshenv home/.zshrc home/.config/shell/toolchain.sh macos/home/.zprofile macos/home/.config/zsh/macos-pre.zsh macos/home/.config/zsh/macos.zsh macos/home/.config/shell/macos.sh
      - name: Test installer and shell startup
        run: python3 -m unittest discover -s tests -v
