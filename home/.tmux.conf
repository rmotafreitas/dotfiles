# better prefix (optional, Ctrl-a is easier to reach than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# mouse support (great for scrolling agent output)
set -g mouse on

# true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# larger scrollback for long agent logs
set -g history-limit 50000

# faster escape time (fixes vim/neovim lag inside tmux)
set -sg escape-time 0

# split panes intuitively
bind | split-window -h
bind - split-window -v

# reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# status bar - keep it informative but light
set -g status-interval 5

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save/restore
set -g @plugin 'tmux-plugins/tmux-yank'        # better copy/paste with SSH clipboard
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
