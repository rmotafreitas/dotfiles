# T3 Chat for lazydocker, generated by scripts/t3_chat_theme.py. lazydocker only takes the
# terminal's color names, so these follow the T3 Chat terminal palette in light and dark.
gui:
  theme:
    activeBorderColor:
      - magenta
      - bold
    inactiveBorderColor:
      - default
    selectedLineBgColor:
      - reverse
    optionsTextColor:
      - magenta
